# Triangle ring tabletop. Shared by controller, router, warnings, simulator (and SUMO later).
# Approach id == id of the inbound edge it belongs to. Movement A = ring axis, B = external axis.
timing:                     # all ms, device-side authoritative
  min_green_ms: 5000
  yellow_ms: 2000
  all_red_ms: 1000
  max_green_ms: 20000
  max_red_ms: 40000
  fallback_green_ms: 8000   # fixed-time cycle when backend is lost
  command_valid_ms: 4000
  backend_lost_ms: 5000
control:
  interval_s: 1.0
  stale_after_s: 5.0
  switch_margin: 1.0        # other axis must beat current by this much
  spillback_occupancy: 0.8  # never feed a link at/above this fraction of capacity
  link_capacity: 8          # vehicles per ROI (tabletop scale)

routing:
  delay_per_vehicle_s: 3.0     # D_e = this * queued vehicles on the edge's ROI
  reroute_threshold: 0.15      # new route must be >15% cheaper than the remaining current route
  min_reroute_interval_s: 5.0
ev:
  location_ttl_s: 4.0          # no position for this long -> location stale
  warn_horizon_s: 20.0         # warn approaches the EV reaches within this time
  imminent_s: 8.0
  default_origin: ext_W
  default_destination: ext_S
incidents:
  congestion_occupancy: 0.75     # fraction of link capacity
  congestion_hold_s: 10          # must persist this long
  congestion_clear_occupancy: 0.5
  congestion_clear_hold_s: 5
  stall_s: 10                    # object stationary this long WHILE its axis has been green
layout:                          # dashboard map coordinates (viewBox 0 0 800 520)
  ext_W: [70, 150]
  ext_E: [730, 150]
  ext_S: [400, 480]
  I1: [240, 170]
  I2: [560, 170]
  I3: [400, 350]
# Overhead-camera vision (Phase 7). Coordinates are the dashboard LAYOUT units above: draw/measure the physical table
# in the same frame (e.g. 1 unit = 1 mm for an 80 x 52 cm board). See docs/VISION_SETUP.md.
vision:
  canvas: [800, 520]                  # size of the rectified top-down image (1 px = 1 layout unit)
  corner_markers: {10: [40, 40], 11: [760, 40], 12: [760, 480], 13: [40, 480]}   # ArUco ids -> marker centres (upright)
  corner_marker_size: 40
  ev_markers: {20: EV-1}              # ArUco id on the connected car -> vehicle id. Marker UP = direction the car faces.
  ev_marker_size: 28
  aruco_dictionary: DICT_4X4_50
  max_calibration_error: 6.0          # mean reprojection error (layout units) above which a calibration is rejected
  lane_offset: 14                     # lane centre-line offset from the road axis (the dashboard map uses the same value).
                                      # Must satisfy roi_half_width < lane_offset so opposite lanes' ROIs never overlap.
  node_radius: 30                     # intersection box radius
  ext_radius: 12                      # external node radius
  roi_exit_clearance: 30              # skip this much of a lane right after it leaves an intersection (the junction's own
                                      # lanes are closer than a lane-width there and would double-count)
  roi_start: 0.0                      # ROI covers this fraction ... of the lane (after node radii) ...
  roi_end: 1.0                        # ... to this fraction
  roi_half_width: 10                  # car_width/2 plus a little lateral slack
  car_length: 28                      # typical vehicle footprint, layout units
  car_width: 16
  car_gap: 6                          # queue spacing used for capacity estimates
  min_blob_fraction: 0.35             # a blob smaller than this share of a car is noise
  diff_threshold: 40                  # grey-level difference against the empty-table reference
  stationary_iou: 0.85                # ROI foreground overlap above which nothing is considered to have moved
  ev_snap_distance: 24                # max distance from a lane centre-line to map the EV marker onto that road
  post_hz: 2.0
node_labels:
  ext_W: the West
  ext_E: the East
  ext_S: the South
  I1: Intersection 1
  I2: Intersection 2
  I3: Intersection 3

intersections: [I1, I2, I3]

# downstream = approach ids (links) this approach discharges into
approaches:
  W1:  {intersection: I1, movement: B, downstream: [L12, L13]}
  L21: {intersection: I1, movement: A, downstream: [L13]}
  L31: {intersection: I1, movement: A, downstream: [L12]}
  E2:  {intersection: I2, movement: B, downstream: [L21, L23]}
  L12: {intersection: I2, movement: A, downstream: [L23]}
  L32: {intersection: I2, movement: A, downstream: [L21]}
  S3:  {intersection: I3, movement: B, downstream: [L31, L32]}
  L13: {intersection: I3, movement: A, downstream: [L32]}
  L23: {intersection: I3, movement: A, downstream: [L31]}

# Road graph for routing (Phase 2). length in table-cm, speed in cm/s.
nodes: [ext_W, ext_E, ext_S, I1, I2, I3]
edges:
  - {id: W1,  from: ext_W, to: I1,    length: 40, speed: 10}
  - {id: E2,  from: ext_E, to: I2,    length: 40, speed: 10}
  - {id: S3,  from: ext_S, to: I3,    length: 40, speed: 10}
  - {id: O1,  from: I1,    to: ext_W, length: 40, speed: 10}
  - {id: O2,  from: I2,    to: ext_E, length: 40, speed: 10}
  - {id: O3,  from: I3,    to: ext_S, length: 40, speed: 10}
  - {id: L12, from: I1, to: I2, length: 60, speed: 10}
  - {id: L21, from: I2, to: I1, length: 60, speed: 10}
  - {id: L13, from: I1, to: I3, length: 50, speed: 10}
  - {id: L31, from: I3, to: I1, length: 50, speed: 10}
  - {id: L23, from: I2, to: I3, length: 50, speed: 10}
  - {id: L32, from: I3, to: I2, length: 50, speed: 10}
