; Road camera (ESP32-CAM, AI-Thinker pinout) mounted on the connected car: sends a JPEG every few seconds.
; The backend locates each frame from the tracked car's position and runs the (heuristic) pothole finder; every detection
; is only an UNREVIEWED report until an operator verifies it.
; Build: pio run -e esp32cam   Flash: pio run -e esp32cam -t upload   (needs a USB-serial adapter; GPIO0 to GND while flashing)
; Copy include/config.example.h -> include/config.h first. Shares the signing core with the intersection controller.
[env:esp32cam]
platform = espressif32@6.5.0
board = esp32cam
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../intersection/lib
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DBOARD_HAS_PSRAM
  -Wall -Wextra
