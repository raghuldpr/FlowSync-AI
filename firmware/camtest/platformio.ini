; ESP32-CAM diagnostic: prints the sensor model, PSRAM, and tries JPEG / RGB565 / grayscale / YUV422 one by one.
; The MB board has its own USB-serial chip: just plug in USB. Build/flash: pio run -d firmware/camtest -t upload
[env:camtest]
platform = espressif32@6.5.0
board = esp32cam
framework = arduino
monitor_speed = 115200
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DBOARD_HAS_PSRAM
  -Wall -Wextra
