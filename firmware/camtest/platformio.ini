; ESP32-CAM (AI-Thinker) bench firmware. The MB board has its own USB-serial chip: just plug in USB.
;   camtest: diagnostic. Prints the sensor model and PSRAM and tries JPEG / RGB565 / grayscale / YUV422 one by one.
;   camweb : STANDALONE web camera. Opens the Wi-Fi "FlowSync-CAM" (password flowsync1); browse to http://192.168.4.1/
; Build/flash: pio run -d firmware/camtest -e camweb -t upload      Monitor: pio device monitor -d firmware/camtest
[env]
platform = espressif32@6.5.0
board = esp32cam
framework = arduino
monitor_speed = 115200
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DBOARD_HAS_PSRAM
  -Wall -Wextra

[env:camtest]
build_src_filter = +<*> -<camweb.cpp>

[env:camweb]
build_src_filter = +<*> -<main.cpp>
