; Car brain (ESP32 DevKit), STANDALONE: no Wi-Fi, no backend. Sensors -> LCD + passive buzzer. Wiring: docs/HARDWARE_CAR_WIRING.md
;   pio run -d firmware/car -e car -t upload        run mode (stream off; type s to turn the sensor stream on)
;   pio run -d firmware/car -e cartest -t upload    same firmware with the sensor stream on at boot (bench bring-up)
;   Monitor: pio device monitor -d firmware/car
[env]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -Wall -Wextra

[env:car]

[env:cartest]
build_flags = ${env.build_flags} -DSTREAM_AT_BOOT=1
