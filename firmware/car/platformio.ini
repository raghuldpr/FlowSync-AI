; Connected car brain (ESP32 DevKit #2). This first image is the BRING-UP TEST: it checks every sensor over the serial monitor.
; Build and flash:  pio run -d firmware/car -t upload      Monitor:  pio device monitor -d firmware/car
[env:cartest]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -Wall -Wextra
