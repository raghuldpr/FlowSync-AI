; Intersection controller (one ESP32 drives all three intersections).
; Build:   pio run -e esp32dev          Flash: pio run -e esp32dev -t upload          Log: pio device monitor
; Before building copy include/config.example.h -> include/config.h and fill it in (never commit config.h).
[env:esp32dev]
; Pinned: the watchdog calls in src/main.cpp use the Arduino-ESP32 2.x API (core 3.x changed esp_task_wdt_init).
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -Wall -Wextra

; Bring-up image: lights one LED at a time, no Wi-Fi, no backend.
[env:lamptest]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DLAMP_TEST
