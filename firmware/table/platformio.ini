; Standalone tabletop demo: 2 ESP32 DevKits, 6 traffic modules (GND,R,Y,G) lit straight from GPIO pins. No Wi-Fi, no backend.
; Board 1 drives I1 + I2 (modules M1..M4), board 2 drives I3 (modules M1, M2). Wiring: docs/HARDWARE_WIRING.md.
;   Flash:   pio run -d firmware/table -e board1 -t upload      pio run -d firmware/table -e board2 -t upload
;   Monitor: pio device monitor -d firmware/table
;   board1_test / board2_test: same pins, serial-driven bench test (one lamp, one colour on all lamps, safe A/B cycle).
[env]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../intersection/lib
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -Wall -Wextra

[env:board1]
build_flags = ${env.build_flags} -DBOARD_ID=1

[env:board2]
build_flags = ${env.build_flags} -DBOARD_ID=2

[env:board1_test]
build_flags = ${env.build_flags} -DBOARD_ID=1 -DBENCH_TEST

[env:board2_test]
build_flags = ${env.build_flags} -DBOARD_ID=2 -DBENCH_TEST
