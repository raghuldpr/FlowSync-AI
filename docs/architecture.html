<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlowSync AI Architecture</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--text:#e6edf3;--mute:#8b949e;--node:#1c2330;--edge:#4b5563;
--sense:#38bdf8;--control:#4ade80;--ev:#f87171;--hazard:#fbbf24;--ai:#c084fc;--acc:#58a6ff}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f6f8fa;--panel:#fff;--line:#d0d7de;--text:#1f2328;--mute:#656d76;--node:#fff;--edge:#9aa4af;
--sense:#0284c7;--control:#16a34a;--ev:#dc2626;--hazard:#d97706;--ai:#9333ea;--acc:#0969da}}
:root[data-theme=light]{--bg:#f6f8fa;--panel:#fff;--line:#d0d7de;--text:#1f2328;--mute:#656d76;--node:#fff;--edge:#9aa4af;
--sense:#0284c7;--control:#16a34a;--ev:#dc2626;--hazard:#d97706;--ai:#9333ea;--acc:#0969da}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,Segoe UI,sans-serif;display:flex;flex-direction:column;height:100vh}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-size:16px;margin:0 8px 0 0}
.grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
button,input{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 10px}
button{cursor:pointer}button:hover{border-color:var(--acc)}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.chip{border-left:4px solid var(--c)}
#live.on{background:#dc2626;border-color:#dc2626}
#live.on::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#fff;margin-right:6px;animation:p 1s infinite}
@keyframes p{50%{opacity:.2}}
main{flex:1;display:flex;min-height:0}
#stage{flex:1;overflow:auto;position:relative}
svg{display:block;min-width:1100px;width:100%}
aside{width:390px;max-width:45vw;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px 16px}
aside h2{margin:0 0 2px;font-size:18px}aside h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:16px 0 4px}
aside ul{margin:0;padding-left:18px}aside li{margin:2px 0}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;border:1px solid var(--line);color:var(--mute);margin-right:4px}
code{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--bg);padding:1px 5px;border-radius:4px}
.links a{display:block;color:var(--acc);cursor:pointer;margin:2px 0}
#ticker{height:92px;overflow:auto;border-top:1px solid var(--line);background:var(--panel);font:12px ui-monospace,Consolas,monospace;padding:6px 16px;color:var(--mute)}
#ticker div b{color:var(--text)}
.band{fill:var(--panel);stroke:var(--line);stroke-dasharray:4 4;opacity:.55}
.bandlbl{fill:var(--mute);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.node{cursor:pointer}
.node rect{fill:var(--node);stroke:var(--line);stroke-width:1.5;transition:.15s}
.node:hover rect{stroke:var(--acc)}
.node.sel rect{stroke:var(--acc);stroke-width:3}
.node .t{fill:var(--text);font-size:12.5px;font-weight:600}
.node .s{fill:var(--mute);font-size:10.5px}
.node .ic{font-size:22px}
.node .dot{opacity:0}.node.hw .dot{opacity:1}
.node.dim,.edge.dim,.elbl.dim{opacity:.13}
.edge{fill:none;stroke:var(--edge);stroke-width:1.6;opacity:.8;cursor:pointer}
.edge.hot{stroke:var(--c);stroke-width:3;opacity:1}
.elbl{fill:var(--mute);font-size:10px;pointer-events:none;paint-order:stroke;stroke:var(--bg);stroke-width:3px}
.pkt{pointer-events:none}
.lamp{transition:fill .2s}
.hint{color:var(--mute);font-size:12px}
@media(max-width:800px){main{flex-direction:column}aside{width:auto;max-width:none;max-height:45vh;border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <h1>FlowSync AI — Architecture</h1>
  <div class="grp" id="flows"></div>
  <div class="grp">
    <button id="live" title="Animate a scripted scenario: normal traffic → ambulance → pothole → LLM proposal">Live mode</button>
    <button id="hwbtn" title="Highlight parts that are physical hardware">Hardware</button>
    <button id="reset">Reset</button>
    <button id="theme">Theme</button>
  </div>
  <div class="grp"><input id="be" size="22" placeholder="http://localhost:8000" title="Optional: poll a running FlowSync backend"><button id="conn">Connect backend</button><span class="hint" id="src">source: simulated</span></div>
</header>
<main>
  <div id="stage"><svg id="svg" viewBox="0 0 1420 950" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <aside id="panel"></aside>
</main>
<div id="ticker"></div>

  parts:['VisionPipeline (pipeline.py)','capacity.py, geometry.py, markers.py','poster.py: signed HTTP poster at 2 Hz'],

n('deviceapi',2,2,'🔐','Device API','HMAC-SHA256, replay-safe',0,{
  desc:'The only door for hardware. Every request is signed; every command to a device passes the validator first.',
  parts:['/traffic, /ev-position, /ev-declare, /state, /images, /commands, /command-ack','security.py: allow-listed ids, boot id, sequence'],
  algo:['HMAC over method|path|device|boot|seq|body','Reject replays and old boot ids','Rate limiting (ratelimit.py)','Stamp receive time on backend clock (devices have no shared clock)'],

n('hazards',2,4,'⚠️','Hazard verifier','pothole heuristic + operator OK',0,{
  desc:'Receives road-camera images, proposes hazard reports and keeps them unreviewed until an operator verifies them.',

  algo:['Median brightness of road; mask pixels < median−45','Open/close morphology; contour area 1–35% of frame','Solidity ≥ 0.80; reject big shadows touching the border','Confidence = ½·area/4% + ½·contrast/35%','Report → operator verify → routing penalty'],
  io:'in: JPEG · out: hazard reports',files:['backend/app/vision/pothole.py','backend/app/core/hazards.py'],status:'Heuristic; fails on real photos'});

n('store',3,0,'🗄️','State store & audit','SQLite + in-memory',0,{
  desc:'Durable state: signals, telemetry, EV positions, incidents, audit trail.',
  parts:['db.py / core/store.py','audit.py','retention.py: traffic 24 h, EV positions 6 h'],

n('controller',3,1,'⚙️','Adaptive controller','pressure + safety rules',0,{
  desc:'Chooses which axis should be green at each intersection from measured demand. It only proposes; the validator and device clamp.',
  parts:['Controller (controller.py)','FSM (fsm.py)'],
  algo:['Pressure = queue on approach − downstream occupancy','Spillback: never feed a link ≥ 80% of capacity','Switch only if other axis beats current by margin 1.0','Starvation rule: demand-based; gridlock rotation when both axes blocked','Min green 5 s · yellow 2 s · all-red 1 s · max green 20 s','Runs every 1 s; telemetry stale after 5 s'],
  io:'in: queues · out: phase proposals',files:['backend/app/core/controller.py','backend/app/core/fsm.py'],status:'Tested; adaptive saves ~35% delay in simulation'});
n('validator',3,2,'🛡️','Deterministic validator','last software gate',0,{
  desc:'Every signal command, whether from the controller, an EV corridor or an approved LLM proposal, must pass these rules.',
  parts:['validator.py','proposals.py'],
  algo:['Conflict matrix: all movements conflict','Min green, yellow and all-red enforced even for EV priority','Reject commands that violate timing or spillback','Command carries seq and valid_for 4 s'],
  io:'in: proposals · out: signed commands',files:['backend/app/core/validator.py'],status:'Tested'});
n('routing',3,3,'🧭','Routing engine','Dijkstra, time + penalties',0,{
  desc:'Finds the fastest route and alternative paths for vehicles and the ambulance.',
  parts:['edge_costs, dijkstra, shortest_tree, path_to','Hysteresis'],
  algo:['Edge cost = free-flow time + 3 s × queued vehicles + hazard penalty','Closed edges removed','Reroute only if new route is > 15% cheaper and ≥ 5 s since last change'],
  io:'in: queues, closures, penalties · out: route + ETA',files:['backend/app/core/routing.py'],status:'Tested'});
n('incidents',3,4,'🚧','Incident manager','congestion & stall detection',0,{
  desc:'Detects congestion and stalled vehicles, then assesses impact and offers an alternative route.',
  parts:['IncidentManager'],
  algo:['Congestion: occupancy ≥ 75% for 10 s; clears at < 50% for 5 s','Stall: object stationary 10 s while its axis was green','Impact assessment + alternative path from routing'],
  io:'in: observations · out: incidents, closures',files:['backend/app/core/incidents.py'],status:'Tested'});
n('ev',3,5,'🚨','EV manager & warnings','green corridor',0,{
  desc:'Tracks the emergency vehicle and creates a time-aligned green corridor and location-aware warnings.',
  parts:['EVManager / EVSession','ev_warnings.py'],
  algo:['Session position TTL 4 s (stale → cancel)','ETA to each approach from route','Warn approaches reached within 20 s; imminent at 8 s','Lifecycle: active → updated → redirected → cancelled/expired','Corridor requests still pass the validator and clearances'],
  io:'in: EV pose · out: priority requests, warnings',files:['backend/app/core/ev.py','backend/app/core/ev_warnings.py'],status:'Tested; 41% faster trip in simulated stall'});
n('roaduser',3,6,'📍','Road-user alerts','anonymous, server-side relevance',0,{
  desc:'Phones join anonymously and receive only alerts that concern their road.',

  algo:['Relevant only if the EV comes up behind the user within a short window, on a road they are on or entering','Fixed lawful templates','Never reveals EV identity, route or position'],
  io:'out: alerts to phones',files:['backend/app/core/roaduser.py'],status:'Tested'});

n('fallback',4,0,'🧾','Deterministic fallback','labelled, no model needed',0,{

  parts:['orchestrator.py','tools.py: read tools + one proposal tool','client.py'],
  algo:['Read tools: signals, queues, incidents, routes','Propose at most one change','Emergency priority outranks it'],

n('driver',5,4,'📲','Driver phone','driver.html',0,{

// edges: from, to, label, flow
const E = [
 ['cars','cam','view','sense'],['aruco','cam','markers','ev'],['cam','camsrc','video','sense'],['camsrc','vision','frames','sense'],
 ['vision','deviceapi','POST /traffic · /ev-position','sense'],
 ['pothole','esp32cam','image','hazard'],['esp32cam','deviceapi','POST /images','hazard'],
 ['evcar','carbrain','button · IMU','ev'],['carbrain','deviceapi','POST /ev-declare','ev'],
 ['usonic','esp32ctl','echo','sense'],
 ['esp32ctl','sr595','data/clock/latch','control'],['sr595','leds','18 outputs','control'],
 ['esp32ctl','deviceapi','state ⇄ commands','control'],
 ['deviceapi','store','persist','sense'],['deviceapi','controller','observations','sense'],
 ['controller','validator','phase proposal','control'],['validator','deviceapi','signed command','control'],
 ['deviceapi','hazards','JPEG','hazard'],['hazards','routing','penalties','hazard'],['controller','incidents','stalls · queues','hazard'],['incidents','routing','closures','hazard'],
 ['deviceapi','ev','EV pose','ev'],['ev','routing','route · ETA','ev'],['ev','validator','corridor request','ev'],['ev','roaduser','warnings','ev'],
 ['store','llm','read tools','ai'],['llm','proposals','propose_change','ai'],['proposals','validator','re-validate','ai'],['proposals','operator','confirm','ai'],['fallback','operator','no-model answer','ai'],
 ['incidents','operator','alerts','hazard'],['controller','presenter','state','control'],['roaduser','driver','relevant alerts','ev'],['ev','public','approach warnings','ev']
];

const NS='http://www.w3.org/2000/svg', svg=document.getElementById('svg');
const el=(t,a={},p=svg)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
BANDS.forEach(([l,y,h])=>{el('rect',{class:'band',x:12,y,width:1396,height:h,rx:12});el('text',{class:'bandlbl',x:26,y:y+16}).textContent=l});
const gE=el('g'),gN=el('g'),gP=el('g');

function anchor(a,b){ // returns [x1,y1,x2,y2,orientation]
  const A=N[a],B=N[b];
  if(A.row===B.row){const r=A.col<B.col;return [A.x+(r?W:0),A.y+H/2,B.x+(r?0:W),B.y+H/2,'h']}
  const down=B.row>A.row;
  return [A.x+W/2,A.y+(down?H:0),B.x+W/2,B.y+(down?0:H),'v'];
}
const edgeEls=E.map(([a,b,l,f],i)=>{
  let [x1,y1,x2,y2,o]=anchor(a,b);
  // spread parallel endpoints a little
  const off=((i*37)%5-2)*9; if(o==='v'){x1+=off;x2+=off}
  const d=o==='h'?`M${x1},${y1} C${(x1+x2)/2},${y1} ${(x1+x2)/2},${y2} ${x2},${y2}`
               :`M${x1},${y1} C${x1},${(y1+y2)/2} ${x2},${(y1+y2)/2} ${x2},${y2}`;
  const p=el('path',{class:'edge',d,'marker-end':'url(#ar)'},gE);
  p.style.setProperty('--c',`var(${FLOWS[f].c})`);
  const t=el('text',{class:'elbl','text-anchor':'middle'},gE);
  const mid=p.getPointAtLength(p.getTotalLength()/2);t.setAttribute('x',mid.x);t.setAttribute('y',mid.y-3);t.textContent=l;
  const ed={a,b,l,f,p,t,i};
  p.onclick=()=>showEdge(ed);return ed;
});
const defs=el('defs',{},svg);
const mk=el('marker',{id:'ar',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'},defs);
el('path',{d:'M0,0L10,5L0,10z',fill:'var(--edge)'},mk);
svg.insertBefore(defs,svg.firstChild);

const lampEls=[];
Object.values(N).forEach(o=>{
  const g=el('g',{class:'node'+(o.hw?' hw':''),transform:`translate(${o.x},${o.y})`},gN);
  el('rect',{width:W,height:H,rx:10},g);
  el('text',{class:'ic',x:12,y:34},g).textContent=o.ic;
  const t=el('text',{class:'t',x:44,y:28},g);t.textContent=o.t.length>19?o.t.slice(0,18)+'…':o.t;
  const s=el('text',{class:'s',x:12,y:56},g);s.textContent=o.s.length>30?o.s.slice(0,29)+'…':o.s;
  el('title',{},g).textContent=o.t+' — '+o.s;
  el('circle',{class:'dot',cx:W-12,cy:12,r:4,fill:'var(--hazard)'},g);
  if(o.id==='leds'){[0,1,2].forEach(k=>{const lp=[];['#ef4444','#eab308','#22c55e'].forEach((c,j)=>{lp.push(el('circle',{class:'lamp',cx:30+k*50+j*10,cy:72,r:3.5,fill:c,opacity:.2},g))});lampEls.push(lp)})}
  g.onclick=()=>select(o.id);o.g=g;
});

// ---- panel
const panel=document.getElementById('panel');
const link=id=>`<a data-id="${id}">${N[id].ic} ${N[id].t}</a>`;
function select(id){
  document.querySelectorAll('.node').forEach(x=>x.classList.remove('sel'));N[id].g.classList.add('sel');
  const o=N[id],up=E.filter(e=>e[1]===id).map(e=>e[0]),dn=E.filter(e=>e[0]===id).map(e=>e[1]);
  const li=a=>'<ul>'+a.map(x=>`<li>${x}</li>`).join('')+'</ul>';
  panel.innerHTML=`<h2>${o.ic} ${o.t}</h2><div>${o.hw?'<span class="tag">hardware</span>':'<span class="tag">software</span>'}<span class="tag">${o.status}</span></div>
  <p>${o.desc}</p><h3>Components</h3>${li(o.parts)}<h3>Algorithm / behaviour</h3>${li(o.algo)}
  <h3>Interface</h3><p><code>${o.io}</code></p><h3>Source</h3>${li(o.files.map(f=>`<code>${f}</code>`))}
  <h3>Receives from</h3><div class="links">${up.map(link).join('')||'—'}</div><h3>Sends to</h3><div class="links">${dn.map(link).join('')||'—'}</div>`;
  panel.querySelectorAll('a').forEach(a=>a.onclick=()=>select(a.dataset.id));
  focus(new Set([id,...up,...dn]));
}
function showEdge(e){
  panel.innerHTML=`<h2>${N[e.a].ic} → ${N[e.b].ic}</h2><div><span class="tag" style="border-color:var(${FLOWS[e.f].c})">${FLOWS[e.f].name}</span></div>
  <p><b>${N[e.a].t}</b> → <b>${N[e.b].t}</b></p><p><code>${e.l}</code></p><div class="links">${link(e.a)}${link(e.b)}</div>`;
  panel.querySelectorAll('a').forEach(a=>a.onclick=()=>select(a.dataset.id));
  focus(new Set([e.a,e.b]),e);
}
function focus(set,only){
  Object.values(N).forEach(o=>o.g.classList.toggle('dim',!set.has(o.id)));
  edgeEls.forEach(e=>{const on=only?e===only:(set.has(e.a)&&set.has(e.b)&&(e.a===[...set][0]||e.b===[...set][0]));e.p.classList.toggle('dim',!on);e.t.classList.toggle('dim',!on);e.p.classList.toggle('hot',on)});
}
function clearFocus(){document.querySelectorAll('.dim,.hot,.sel').forEach(x=>x.classList.remove('dim','hot','sel'))}
svg.addEventListener('click',e=>{if(e.target===svg||e.target.classList.contains('band')){clearFocus();intro()}});
function intro(){panel.innerHTML=`<h2>FlowSync AI</h2><p>Adaptive traffic signals and emergency-vehicle priority for a three-intersection tabletop. The <b>backend decides</b>, the ESP32 <b>executes</b>, and the LLM only <b>proposes</b>.</p>
 <h3>How to use</h3><ul><li>Click any block for its components, algorithm, interface and source files.</li><li>Click a line for the message it carries.</li><li>Use the coloured flow buttons to trace one story end to end.</li><li><b>Live mode</b> runs a scripted scenario; <b>Connect backend</b> polls a real server.</li></ul>
 <h3>Four layers of defence</h3><ol><li>Controller proposes</li><li>Validator checks timing and conflicts</li><li>Device enforces yellow/all-red and falls back after 5 s</li><li>LLM changes need a human confirm</li></ol>
 <h3>Honest status</h3><p>Software and firmware are built and tested; hardware is <b>not yet wired</b>. Camera vision is verified on a synthetic camera only. Benefits shown are simulated.</p>`}
intro();

// ---- flow filters
const fl=document.getElementById('flows');let activeFlow=null;
Object.entries(FLOWS).forEach(([k,f])=>{const b=document.createElement('button');b.className='chip';b.style.setProperty('--c',`var(${f.c})`);b.textContent=f.name;
  b.onclick=()=>{activeFlow=activeFlow===k?null:k;fl.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
    if(!activeFlow){clearFocus();return}b.classList.add('on');const s=new Set();
    edgeEls.forEach(e=>{const on=e.f===activeFlow;if(on){s.add(e.a);s.add(e.b)}e.p.classList.toggle('dim',!on);e.t.classList.toggle('dim',!on);e.p.classList.toggle('hot',on)});
    Object.values(N).forEach(o=>o.g.classList.toggle('dim',!s.has(o.id)))};fl.appendChild(b)});
document.getElementById('hwbtn').onclick=e=>{e.target.classList.toggle('on');const on=e.target.classList.contains('on');clearFocus();
  Object.values(N).forEach(o=>o.g.classList.toggle('dim',on&&!o.hw));edgeEls.forEach(x=>{const d=on&&!(N[x.a].hw&&N[x.b].hw);x.p.classList.toggle('dim',d);x.t.classList.toggle('dim',d)})};
document.getElementById('reset').onclick=()=>{activeFlow=null;fl.querySelectorAll('button').forEach(x=>x.classList.remove('on'));document.getElementById('hwbtn').classList.remove('on');clearFocus();intro()};
document.getElementById('theme').onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).getPropertyValue('--bg').trim()==='#0d1117';r.dataset.theme=d?'light':'dark'};

// ---- live mode
const tick=document.getElementById('ticker');
function log(msg,flow){const d=document.createElement('div');d.innerHTML=`<b>${new Date().toLocaleTimeString()}</b> <span style="color:var(${FLOWS[flow||'sense'].c})">●</span> ${msg}`;tick.appendChild(d);tick.scrollTop=1e9;while(tick.children.length>80)tick.firstChild.remove()}
// scenario: [start s, end s, active flows, message]
const SCEN=[
 [0,12,['sense','control'],'Camera counts queues → controller balances green time (adaptive signals)'],
 [12,26,['sense','control','ev'],'Ambulance EV-1 detected by ArUco marker → green corridor requested, warnings sent to relevant phones'],
 [26,38,['sense','control','hazard'],'Pothole image from ESP32-CAM → hazard report → operator verify → routing penalty'],
 [38,50,['sense','control','ai'],'LLM reads state, proposes one change → validator → operator confirm → device clamps to safe timing']
];
const LOOP=50;let live=false,t0=0,pk=[],raf,lastSpawn=0,lastPhase=-1,backend=null;
const phases=[[0,2,0],[1,1,0],[2,0,0]];
function setLamps(t){lampEls.forEach((lp,k)=>{const s=Math.floor((t+k*3)/6)%2,w=(t+k*3)%6;const yel=w>4;lp.forEach((c,j)=>c.setAttribute('opacity',(j===0?(s===0&&!yel?0:(yel?0:1))*1:(j===1?yel?1:0:(s===0&&!yel?1:0)))*0.9+0.1))})}
function frame(now){
  if(!live)return;const t=((now-t0)/1000)%LOOP;
  const act=new Set();SCEN.forEach(s=>{if(t>=s[0]&&t<s[1])s[2].forEach(f=>act.add(f))});
  const ph=SCEN.findIndex(s=>t>=s[0]&&t<s[1]);
  if(ph!==lastPhase){lastPhase=ph;log(SCEN[ph][3],SCEN[ph][2][SCEN[ph][2].length-1])}
  edgeEls.forEach(e=>{const on=act.has(e.f);e.p.classList.toggle('hot',on);e.p.classList.toggle('dim',!on)});
  edgeEls.forEach(e=>e.t.classList.toggle('dim',!act.has(e.f)));
  Object.values(N).forEach(o=>{const used=edgeEls.some(e=>act.has(e.f)&&(e.a===o.id||e.b===o.id));o.g.classList.toggle('dim',!used)});
  if(now-lastSpawn>260){lastSpawn=now;edgeEls.forEach(e=>{if(act.has(e.f)&&Math.random()<.35){const c=el('circle',{class:'pkt',r:4.5,fill:`var(${FLOWS[e.f].c})`},gP);pk.push({c,e,s:now,dur:1100+Math.random()*700})}})}
  pk=pk.filter(q=>{const u=(now-q.s)/q.dur;if(u>=1){q.c.remove();return false}const L=q.e.p.getTotalLength(),pt=q.e.p.getPointAtLength(L*u);q.c.setAttribute('cx',pt.x);q.c.setAttribute('cy',pt.y);return true});
  setLamps(t);
  if(backend&&backend.n)document.getElementById('src').textContent=`source: backend · ${backend.n} signals`;
  raf=requestAnimationFrame(frame);
}
const lb=document.getElementById('live');
lb.onclick=()=>{live=!live;lb.classList.toggle('on',live);lb.textContent=live?'Live: ON':'Live mode';
  if(live){clearFocus();t0=performance.now();lastPhase=-1;log('Live mode started (scripted scenario, '+LOOP+' s loop)');raf=requestAnimationFrame(frame)}
  else{cancelAnimationFrame(raf);pk.forEach(q=>q.c.remove());pk=[];clearFocus();lampEls.forEach(lp=>lp.forEach(c=>c.setAttribute('opacity',.2)))}};

// ---- optional real backend polling
document.getElementById('conn').onclick=async()=>{
  const base=(document.getElementById('be').value||location.origin).replace(/\/$/,'');
  try{const r=await fetch(base+'/api/health');if(!r.ok)throw 0;const h=await r.json();
    document.getElementById('src').textContent='source: backend connected';log('Connected to '+base+' — '+JSON.stringify(h).slice(0,100));backend={n:0};
    setInterval(async()=>{try{const s=await (await fetch(base+'/api/public/signals')).json();backend.n=Array.isArray(s)?s.length:Object.keys(s.signals||s).length;
      const w=await (await fetch(base+'/api/public/warnings')).json();const wn=Array.isArray(w)?w.length:Object.keys(w.warnings||w).length;
      if(wn&&!backend.w)log(wn+' active EV warning(s) from backend','ev');backend.w=wn}catch(e){}},2000);
    if(!live)lb.click();
  }catch(e){document.getElementById('src').textContent='source: simulated (backend unreachable)';log('Could not reach '+base+' — staying simulated','hazard')}};
</script>
</body>
